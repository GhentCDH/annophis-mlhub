# Annotators are defined as [[annotator]] entries.
# Each needs: name, annotation_type, class_path.
# Any extra fields are passed to the annotator constructor.

[[annotator]]
name = "dummy-ner"
annotation_type = "ner"
class_path = "konekaare.annotators.dummy.DummyNerAnnotator"

# Example: generic remote annotator (no custom subclass needed).
# The remote service must speak the konekaare protocol (POST /annotate).
# Start a model service with: python -m konekaare.worker serve my_module:MyModel
#
# [[annotator]]
# name = "remote-ner"
# annotation_type = "ner"
# class_path = "konekaare.annotators.remote.GenericRemoteAnnotator"
# base_url = "http://localhost:8001"
# endpoint = "/annotate"     # optional, defaults to /annotate
# timeout = 30.0             # optional, defaults to 30s

[[annotator]]
name = "colinmodel"
annotation_type = "pos"
class_path = "konekaare.annotators.remote.GenericRemoteAnnotator"
base_url = "http://localhost:10000"
