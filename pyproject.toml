[project]
name = "annohub"
version = "0.1.0"
description = "Text annotation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "scalar-fastapi>=1.7",
  "rich>=14.3.3",
  "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["annohub*"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_auto_indent = true

[project.scripts]
annohub = "main:main"
