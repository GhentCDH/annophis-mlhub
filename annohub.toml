# Annotators are defined as [[annotator]] entries.
# Each needs: name, annotation_type, class_path.
# Any extra fields are passed to the annotator constructor.

[[annotator]]
name = "dummy-ner"
annotation_type = "ner"
class_path = "annohub.annotators.dummy.DummyNerAnnotator"

[[annotator]]
name = "slow-ner"
annotation_type = "ner"
class_path = "annohub.annotators.slow_dummy.SlowDummyAnnotator"
delay = 1.0

# Example: generic remote annotator (no custom subclass needed).
# The remote service must speak the annohub protocol (POST /annotate).
# Start a model service with: python -m annohub.worker serve my_module:MyModel
#
# [[annotator]]
# name = "remote-ner"
# annotation_type = "ner"
# class_path = "annohub.annotators.remote.GenericRemoteAnnotator"
# base_url = "http://localhost:8001"
# endpoint = "/annotate"     # optional, defaults to /annotate
# timeout = 30.0             # optional, defaults to 30s

[[annotator]]
name = "colinmodel"
annotation_type = "pos"
class_path = "annohub.annotators.remote.GenericRemoteAnnotator"
base_url = "http://localhost:10000"
description = "DBBert model for Part of Speech. Excpects greek"
labels = ["POS", "DBBert", "remote", "greek"]

[[annotator]]
name = "hf-ner"
annotation_type = "ner"
class_path = "annohub.annotators.huggingface.HuggingFaceAnnotator"
model = "dslim/bert-base-NER"
token = "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"
base_url = "https://router.huggingface.co/hf-inference"
description = "Huggingface NER model (dslim/bert-base-NER)"
labels = ["MANY"]
